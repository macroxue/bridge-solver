<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fast Double-Dummy Solver Web Demo</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    max-width: 640px;
    margin: 2rem auto;
    padding: 0 1rem;
    color: #222;
  }
  h1 { font-size: 1.3rem; }
  .hands {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    grid-template-areas:
      ".    north .   "
      "west center east"
      ".    south .   ";
    gap: 0.75rem;
    justify-items: center;
    margin-bottom: 1rem;
  }
  .hands .west  { grid-area: west; }
  .hands .north { grid-area: north; }
  .hands .east  { grid-area: east; }
  .hands .south { grid-area: south; }
  .hands .center {
    grid-area: center;
    color: #bbb;
    font-size: 1.6rem;
  }
  .hands .seat {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.25rem;
  }
  .hands label { font-weight: 600; }
  .hands input {
    font-family: monospace;
    font-size: 1rem;
    padding: 0.3rem 0.5rem;
    width: 11rem;
    text-align: center;
  }
  .controls {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    flex-wrap: wrap;
    margin-bottom: 0.75rem;
  }
  button, select {
    font-size: 1rem;
    padding: 0.4rem 1.2rem;
    cursor: pointer;
  }
  button:disabled, select:disabled { cursor: default; opacity: 0.6; }
  #status { margin: 0.75rem 0; color: #555; }
  table { border-collapse: collapse; margin-top: 0.5rem; }
  th, td {
    border: 1px solid #ccc;
    padding: 0.3rem 0.8rem;
    text-align: center;
  }
  th { background: #f0f0f0; }
  .red { color: #c00; }
  .black { color: #000; }
  p.hint { color: #666; font-size: 0.9rem; }
  p.source {
    margin-top: 0;
    color: #999;
    font-size: 0.85rem;
  }
  p.source a { color: inherit; }
</style>
</head>
<body>
  <h1>Fast Double-Dummy Solver Web Demo</h1>
  <p class="source">
    Source on <a href="https://github.com/macroxue/bridge-solver" target="_blank" rel="noopener">https://github.com/macroxue/bridge-solver</a>
  </p>
  <p class="hint">
    Enter each hand as Spades Hearts Diamonds Clubs, space-separated
    (e.g. <code>AKQ T98765 2 QJ432</code>). Use <code>T</code> or
    <code>10</code> for ten, <code>-</code> for a void suit, and
    <code>X</code> for a small (don't-care) card.
  </p>

  <div class="hands">
    <div class="seat north">
      <label for="north">North</label>
      <input id="north" value="42 AQT63 K52 T84">
    </div>
    <div class="seat west">
      <label for="west">West</label>
      <input id="west" value="KT8 KJ9875 Q8 75">
    </div>
    <div class="center">&spades;</div>
    <div class="seat east">
      <label for="east">East</label>
      <input id="east" value="AJ65 42 J963 KQJ">
    </div>
    <div class="seat south">
      <label for="south">South</label>
      <input id="south" value="Q973 - AT74 A9632">
    </div>
  </div>

  <div class="controls">
    <select id="freakDealNum">
      <option value="" selected disabled>Load freak deal…</option>
    </select>
    <select id="hardDealNum">
      <option value="" selected disabled>Load hard deal…</option>
    </select>
    <button id="deal">Random Deal</button>
    <button id="solve" disabled>Solve</button>
  </div>
  <div id="status">Loading solver…</div>
  <div id="table"></div>

  <script src="deals.js"></script>
  <script src="app.js"></script>
</body>
</html>
